# Tests de Wanllan à chaque envoi sur GitHub. Le serveur ne met en ligne
# un commit que si la vérification « tests » ci-dessous est verte
# (deploy/lightsail/bin/wanllan-deploy).
name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wanllan_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: boutique
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, gd, intl, bcmath, zip, exif
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: boutique/package-lock.json

      - name: Dépendances PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Styles (même build qu'en production)
        run: npm ci --no-audit --no-fund && npm run build

      - name: Clé de l'app
        run: cp .env.example .env && php artisan key:generate

      - name: Tests sur MySQL 8, comme en production
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: wanllan_test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Mise en cache de production
        run: php artisan optimize && php artisan optimize:clear
