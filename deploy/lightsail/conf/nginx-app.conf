# Wanllan : partie commune aux configurations http et https (voir wanllan-nginx).
root /var/www/wanllan/current/public;
index index.php;
charset utf-8;
client_max_body_size 90m;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Styles et scripts : le nom change à chaque version, on peut les garder un an.
location /build/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
}

# Photos des produits : chaque photo a un nom unique.
location /storage/ {
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
    try_files $uri =404;
}

location = /favicon.ico { access_log off; log_not_found off; }
location = /robots.txt { access_log off; log_not_found off; }

location ~ \.php$ {
    fastcgi_pass unix:/run/php/wanllan.sock;
    include fastcgi_params;
    # $realpath_root : suit le lien « current » vers la nouvelle version.
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_hide_header X-Powered-By;
    fastcgi_read_timeout 120s;
}

location ~ /\.(?!well-known) {
    deny all;
}
