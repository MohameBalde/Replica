; PHP pour Wanllan (FPM). La taille des envois suit les règles de l'app :
; 10 photos de 8 Mo au plus par produit.
expose_php = Off
upload_max_filesize = 10M
post_max_size = 90M
max_file_uploads = 20
memory_limit = 256M
opcache.enable = 1
opcache.memory_consumption = 96
opcache.max_accelerated_files = 20000
; Le code ne change qu'à la mise en ligne, qui recharge PHP.
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
