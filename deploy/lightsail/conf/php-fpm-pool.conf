; PHP tourne avec l'utilisateur de l'app, pas avec www-data.
[wanllan]
user = wanllan
group = wanllan
listen = /run/php/wanllan.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
; 5 processus au plus : la mémoire tient même pendant des envois de photos.
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
request_terminate_timeout = 120s
