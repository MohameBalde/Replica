<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#3730a3">
    <title>Pas de connexion · Wanllan</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #111827;
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
        main { padding: 24px; max-width: 320px; }
        h1 { font-size: 20px; margin: 16px 0 8px; }
        p { color: #5b6470; line-height: 1.5; margin: 0 0 20px; }
        button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 12px; background: #3730a3; color: #fff;
                 font-size: 16px; font-weight: 600; }
    </style>
</head>
<body>
<main>
    <!-- Logo en ligne : sans réseau, aucune image ne peut être chargée. -->
    <svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
        <rect width="64" height="64" rx="16" fill="#3730a3"/>
        <path d="M12 18l8 28 8-20 4 10 4-10 8 20 8-28" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="50" cy="14" r="6" fill="#f59e0b"/>
    </svg>
    <h1>Pas de connexion</h1>
    <p>Vérifiez vos données mobiles ou le Wi-Fi, puis réessayez. Vos commandes vous attendent.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
</main>
</body>
</html>
